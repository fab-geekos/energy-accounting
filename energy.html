<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jauge d'énergie</title>
<!-- Cette page était la comptabilité de la journée. Elle a fusionné avec la
     jauge du matin dans index.html, qui les présente en trois onglets.
     Le fichier reste ici uniquement pour ne pas casser ce qui pointait dessus :
     les favoris de Fabien et le lien de l'archipel. Il redirige vers l'onglet
     Journée. Ne pas le supprimer sans avoir vérifié qu'aucun lien ne subsiste.
     Deux mécanismes, parce qu'aucun ne suffit seul : `location.replace` agit
     tout de suite mais suppose JavaScript actif, la balise meta prend le relais
     sinon. `replace` et non `href` pour ne pas empiler d'entrée d'historique,
     sans quoi le bouton Retour renverrait ici en boucle. -->
<meta http-equiv="refresh" content="0; url=index.html#journee">
<link rel="canonical" href="index.html">
<script>location.replace('index.html#journee');</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px">
  Cette page a fusionné avec la jauge du matin.
  <a href="index.html#journee">Ouvrir la jauge d'énergie</a>
</p>
</body>
</html>
