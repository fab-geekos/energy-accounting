<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jauge d'énergie — Energy Accounting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%A1</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#fafafa;color:#2C3E50;padding:0}
.container{max-width:720px;margin:0 auto;padding:20px 16px}
.title{text-align:center;margin-bottom:6px}
.title h1{font-size:24px;font-weight:700;color:#1a1a2e;letter-spacing:-0.5px;margin-bottom:3px}
.title p{font-size:13px;color:#888;font-weight:300}
.tabs{display:flex;gap:0;margin:16px 0 20px;border-bottom:2px solid #eee}
.tab{flex:1;text-align:center;padding:11px 0;font-size:14px;font-weight:500;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:#666}
.tab.active{color:#1a1a2e;border-bottom-color:#1a1a2e;font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
.section-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f2f5}
.section-icon{font-size:20px}
.section-name{font-size:15px;font-weight:600}
.section-total{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px}
.items{display:flex;flex-direction:column;gap:4px}
.item-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;transition:all .15s;user-select:none;flex-wrap:wrap}
.item-row:hover{background:#f8f8fa}
.item-row.checked{background:#f0f7ff}
.item-check{width:20px;height:20px;border-radius:6px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px;color:#fff}
.item-row.checked .item-check{border-color:var(--accent);background:var(--accent)}
.item-label{font-size:13px;color:#555;flex:1}
.item-value{font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px}
.item-multi{display:flex;align-items:center;gap:4px;margin-left:28px;margin-top:4px;width:100%}
.multi-input{width:50px;padding:4px 8px;border-radius:8px;border:2px solid #ddd;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;text-align:center;color:#1a1a2e;outline:none;transition:border-color .2s}
.multi-input:focus{border-color:#4A6FA5}
.multi-label{font-size:11px;color:#888}
.multi-total{font-size:12px;font-weight:600;margin-left:auto;padding:2px 8px;border-radius:12px}
.start-gauge{display:flex;align-items:center;gap:16px;padding:8px 0}
.start-input{width:80px;padding:8px 12px;border-radius:10px;border:2px solid #eee;font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;text-align:center;color:#1a1a2e;outline:none;transition:border-color .2s}
.start-input:focus{border-color:#4A6FA5}
.start-slider{flex:1;-webkit-appearance:none;height:8px;border-radius:4px;background:#e8ecf0;outline:none}
.start-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#4A6FA5;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.calc-row{display:flex;gap:10px;margin:16px 0}
.calc-btn{flex:1;padding:14px;border-radius:14px;border:none;font-size:15px;font-family:'Outfit',sans-serif;font-weight:600;cursor:pointer;color:#fff;background:#1a1a2e;transition:all .2s}
.calc-btn:hover{background:#2a2a4e}
.reset-btn{padding:14px 18px;border-radius:14px;border:2px solid #ddd;font-size:13px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;background:#fff;color:#888}
.results{background:#fff;border-radius:18px;padding:24px 20px;display:none;margin-bottom:16px}
.gauge-value{text-align:center;font-size:56px;font-weight:700;line-height:1}
.gauge-sub{text-align:center;font-size:13px;font-weight:500;color:#888;margin-top:4px}
.bar-bg{height:14px;background:#f0f2f5;border-radius:10px;overflow:hidden;margin:16px 0}
.bar-fill{height:100%;border-radius:10px;transition:width .8s ease}
.gauge-label{text-align:center;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;margin-bottom:16px}
.detail-title{font-size:12px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;margin-top:16px}
.detail-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.rec-item{display:flex;gap:8px;padding:4px 0;font-size:13px;color:#555}
.rec-arrow{font-weight:600;flex-shrink:0}
.save-btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-family:'Outfit',sans-serif;font-weight:600;cursor:pointer;color:#fff;background:#2D936C;margin-top:16px;transition:all .2s}
.save-btn:hover{background:#247a59}
.save-btn:disabled{background:#ccc;cursor:not-allowed}
.save-msg{text-align:center;font-size:13px;color:#2D936C;font-weight:500;margin-top:8px;display:none}
.filter-bar{display:flex;gap:6px;margin-bottom:16px}
.filter-btn{padding:8px 16px;border-radius:20px;border:2px solid #eee;font-size:13px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;background:#fff;color:#888;transition:all .2s}
.filter-btn.active{border-color:#1a1a2e;color:#1a1a2e;font-weight:600}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.nav-btn{padding:6px 14px;border-radius:10px;border:2px solid #eee;background:#fff;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;color:#555}
.nav-btn:hover{border-color:#1a1a2e;color:#1a1a2e}
.nav-label{font-size:15px;font-weight:600;color:#1a1a2e}
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
.stat-value{font-size:22px;font-weight:700}
.stat-label{font-size:10px;color:#aaa;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.chart-container{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.history-table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.history-table th{background:#1a1a2e;color:#fff;padding:9px 14px;font-size:12px;font-weight:600;text-align:left}
.history-table td{padding:8px 14px;font-size:13px;border-bottom:1px solid #f0f2f5}
.pct-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:600;font-size:12px}
.del-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#ccc;transition:color .2s}
.del-btn:hover{color:#E07A5F}
.no-data{text-align:center;padding:30px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="title"><h1>Jauge d'énergie</h1><p>Energy Accounting , suivi quotidien</p></div>
<div class="tabs">
<div class="tab active" onclick="switchTab('quest')">📋 Questionnaire</div>
<div class="tab" onclick="switchTab('data')">📊 Données</div>
</div>

<div class="tab-content active" id="tab-quest">
<div class="section-card">
<div class="section-header"><span class="section-icon">⚡</span><span class="section-name" style="color:#4A6FA5">Jauge de départ ce matin</span></div>
<div class="start-gauge">
<input type="range" class="start-slider" id="startSlider" min="0" max="100" value="100" oninput="syncStart(this.value)">
<input type="number" class="start-input" id="startInput" min="0" max="100" value="100" onchange="syncStart(this.value)">
<span style="font-size:14px;font-weight:600;color:#888">%</span>
</div>
</div>
<div id="drainSections"></div>
<div id="rechargeSections"></div>
<div class="calc-row">
<button class="calc-btn" onclick="calculate()">Calculer ma jauge</button>
<button class="reset-btn" onclick="resetAll()">Reset</button>
</div>
<div class="results" id="results">
<div class="gauge-value" id="gaugeValue"></div>
<div class="gauge-sub">Jauge actuelle estimée</div>
<div class="bar-bg"><div class="bar-fill" id="gaugeFill"></div></div>
<div class="gauge-label" id="gaugeLabel"></div>
<div class="detail-title">Résumé</div>
<div id="summaryRows"></div>
<div id="recsBlock" style="margin-top:16px"><div class="detail-title">Recommandations</div><div id="recsList"></div></div>
<div id="optMsg" style="display:none;text-align:center;font-size:14px;font-weight:500;margin-top:12px"></div>
<button class="save-btn" id="saveBtn" onclick="saveEntry()">💾 Sauvegarder</button>
<div class="save-msg" id="saveMsg">✓ Sauvegardé !</div>
</div>
</div>

<div class="tab-content" id="tab-data">
<div class="filter-bar">
<button class="filter-btn active" onclick="setFilter('week')">Semaine</button>
<button class="filter-btn" onclick="setFilter('month')">Mois</button>
<button class="filter-btn" onclick="setFilter('year')">Année</button>
</div>
<div class="nav-row">
<button class="nav-btn" onclick="nav(-1)">← Précédent</button>
<span class="nav-label" id="navLabel"></span>
<button class="nav-btn" onclick="nav(1)">Suivant →</button>
</div>
<div class="stats-row" id="statsRow"></div>
<div class="chart-container"><canvas id="chart" height="200"></canvas></div>
<table class="history-table"><thead><tr><th>Date</th><th>Énergie</th><th></th></tr></thead><tbody id="histBody"></tbody></table>
</div>
</div>

<script>
// =================== CONFIG ===================
// multi: {unit:"heures"} or {unit:"réunions"} or {unit:"tâches"} means it has a quantity multiplier
const drains = [
  {cat:"Travail",color:"#E07A5F",icon:"💼",items:[
    {id:"d1",label:"Salle blanche",value:-15,multi:{unit:"heures",def:1}},
    {id:"d2",label:"Manipulation délicate/critique en salle blanche",value:-40},
    {id:"d3",label:"Travail au bureau",value:-10,multi:{unit:"heures",def:1}},
    {id:"d4",label:"Réunion (1h)",value:-20,multi:{unit:"réunions",def:1}},
    {id:"d5",label:"Visioconférence",value:-20,multi:{unit:"réunions",def:1}},
    {id:"d6",label:"Interruption imprévue + deadline rapide",value:-30},
    {id:"d7",label:"Tâche intellectuelle plaisir sans pause",value:-10,multi:{unit:"heures",def:1}},
    {id:"d8",label:"Tâche intellectuelle non-plaisir sans pause",value:-20,multi:{unit:"heures",def:1}},
    {id:"d9",label:"Tâche administrative",value:-10,multi:{unit:"tâches",def:1}},
    {id:"d10",label:"Transition entre activités",value:-5,multi:{unit:"fois",def:1}}
  ]},
  {cat:"Transport",color:"#9DB4C0",icon:"🚲",items:[
    {id:"d11",label:"Transport en commun",value:-10},
    {id:"d12",label:"Vélo (beau temps)",value:0},
    {id:"d13",label:"Vélo (mauvais temps)",value:-20}
  ]},
  {cat:"Social",color:"#D4A5A5",icon:"👥",items:[
    {id:"d14",label:"Liens sociaux proactifs et voulus",value:-5},
    {id:"d15",label:"Liens sociaux subis",value:-20},
    {id:"d16",label:"Small talk obligatoire",value:-5,multi:{unit:"fois",def:1}},
    {id:"d17",label:"Repas petit groupe (4-5 pers.)",value:-20},
    {id:"d18",label:"Repas grand groupe",value:-60},
    {id:"d19",label:"Confrontation sans préparation",value:-40},
    {id:"d20",label:"Confrontation avec préparation",value:-5},
    {id:"d21",label:"Garde d'enfant",value:-30,multi:{unit:"heures",def:1}}
  ]},
  {cat:"Domestique",color:"#81B29A",icon:"🏠",items:[
    {id:"d22",label:"Courses",value:-20},
    {id:"d23",label:"Shopping",value:-40},
    {id:"d24",label:"Shopping le weekend",value:-50},
    {id:"d25",label:"Cuisiner (simple)",value:-10},
    {id:"d26",label:"Cuisiner (complexe)",value:-20}
  ]},
  {cat:"Physique",color:"#F2CC8F",icon:"🏃",items:[
    {id:"d27",label:"Sport séance normale",value:-10},
    {id:"d28",label:"Sport séance performance",value:-30},
    {id:"d29",label:"Digestion",value:-15}
  ]},
  {cat:"Sensoriel",color:"#B8A9C9",icon:"🔊",items:[
    {id:"d30",label:"Bruits environnants",value:-20,multi:{unit:"heures",def:1}}
  ]}
];

const recharges = [
  {cat:"Repos et régulation",color:"#2D936C",icon:"🧘",items:[
    {id:"r1",label:"Sieste",value:15},
    {id:"r2",label:"Pièce sans bruit",value:12,multi:{unit:"heures",def:1}},
    {id:"r3",label:"Être seul",value:7,multi:{unit:"heures",def:1}},
    {id:"r4",label:"Méditation / cohérence cardiaque (5 min+)",value:5},
    {id:"r5",label:"Douche chaude",value:7},
    {id:"r6",label:"Pause régulière",value:5,multi:{unit:"pauses",def:1}}
  ]},
  {cat:"Loisirs et décompression",color:"#4A6FA5",icon:"📚",items:[
    {id:"r7",label:"Lire dans le calme",value:15,multi:{unit:"heures",def:1}},
    {id:"r8",label:"Regarder un film le soir",value:15},
    {id:"r9",label:"Jouer à la console",value:10,multi:{unit:"heures",def:1}},
    {id:"r10",label:"Faire du Lego",value:10,multi:{unit:"heures",def:1}},
    {id:"r11",label:"Écouter de la musique",value:5},
    {id:"r12",label:"Écouter un podcast d'intérêt",value:5},
    {id:"r13",label:"Rire (vidéo drôle, manga, ami)",value:7}
  ]},
  {cat:"Accomplissement",color:"#E07A5F",icon:"✅",items:[
    {id:"r14",label:"Finir une tâche prévue",value:10,multi:{unit:"tâches",def:1}},
    {id:"r15",label:"Finir sa to-do list du jour",value:10},
    {id:"r16",label:"Monde imaginaire intérieur / bouger",value:10}
  ]},
  {cat:"Extérieur et nature",color:"#81B29A",icon:"🌿",items:[
    {id:"r17",label:"Marcher dans la nature",value:10,multi:{unit:"heures",def:1}},
    {id:"r18",label:"Sortir dehors par bonne météo",value:5}
  ]},
  {cat:"Social choisi",color:"#D4A5A5",icon:"📞",items:[
    {id:"r19",label:"Appel famille/ami proche (court)",value:15},
    {id:"r20",label:"Appel trop long",value:-10}
  ]},
  {cat:"Domestique choisi",color:"#9DB4C0",icon:"🍳",items:[
    {id:"r21",label:"Cuisiner sans pression",value:5},
    {id:"r22",label:"Ranger un espace",value:5},
    {id:"r23",label:"Réparer quelque chose",value:3}
  ]}
];

let checked = {};   // id -> true
let quantities = {}; // id -> number
let startGauge = 100;
let currentGauge = null;
let currentFilter = 'week';
let navOffset = 0;
let chartInst = null;

// =================== HELPERS ===================
function getAllItems(){return [...drains,...recharges].flatMap(c=>c.items)}
function getItem(id){return getAllItems().find(i=>i.id===id)}
function getItemTotal(it){
  if(!checked[it.id]) return 0;
  if(it.multi) return it.value * (quantities[it.id] || it.multi.def);
  return it.value;
}
function getData(){try{return JSON.parse(localStorage.getItem('energyData')||'{}')}catch(e){return {}}}
function setData(d){localStorage.setItem('energyData',JSON.stringify(d))}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){const days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];const mo=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];const d=new Date(s+'T12:00:00');return days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear()}
function shortD(s){const d=new Date(s+'T12:00:00');return['D','L','M','M','J','V','S'][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)}

// =================== TABS ===================
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('.tab')[t==='quest'?0:1].classList.add('active');
  if(t==='data'){navOffset=0;renderData()}
}

function syncStart(v){v=Math.max(0,Math.min(100,parseInt(v)||0));startGauge=v;document.getElementById('startSlider').value=v;document.getElementById('startInput').value=v}

// =================== RENDER ===================
function renderSections(){
  const dc=document.getElementById('drainSections');dc.innerHTML='';
  drains.forEach(cat=>{dc.innerHTML+=buildSection(cat)});
  const rc=document.getElementById('rechargeSections');rc.innerHTML='';
  recharges.forEach(cat=>{rc.innerHTML+=buildSection(cat)});
}

function buildSection(cat){
  const totalVal=cat.items.reduce((s,it)=>s+getItemTotal(it),0);
  const hasChecked=cat.items.some(it=>checked[it.id]);
  const tc=totalVal>0?'#2D936C':totalVal===0?'#aaa':'#E07A5F';
  const tb=totalVal>0?'#2D936C15':totalVal===0?'#88888815':'#E07A5F15';
  const totalHtml=hasChecked?'<span class="section-total" style="color:'+tc+';background:'+tb+'">'+(totalVal>0?'+':'')+totalVal+'%</span>':'';
  let itemsHtml='';
  cat.items.forEach(it=>{
    const ic=!!checked[it.id];
    const vc=it.value>0?'#2D936C':it.value===0?'#888':'#E07A5F';
    const vb=it.value>0?'#2D936C15':it.value===0?'#88888815':'#E07A5F15';
    const unitLabel=it.multi?(' /'+it.multi.unit.slice(0,-1)):'';
    itemsHtml+='<div class="item-row'+(ic?' checked':'')+'" style="--accent:'+cat.color+'">';
    itemsHtml+='<div class="item-check" onclick="toggle(\''+it.id+'\')">'+(ic?'✓':'')+'</div>';
    itemsHtml+='<span class="item-label" onclick="toggle(\''+it.id+'\')">'+it.label+'</span>';
    itemsHtml+='<span class="item-value" style="color:'+vc+';background:'+vb+'">'+(it.value>0?'+':'')+it.value+'%'+(it.multi?'/'+it.multi.unit.replace(/s$/,''):'')+'</span>';
    if(ic && it.multi){
      const qty=quantities[it.id]||it.multi.def;
      const tot=it.value*qty;
      const totC=tot>0?'#2D936C':tot===0?'#888':'#E07A5F';
      const totB=tot>0?'#2D936C15':tot===0?'#88888815':'#E07A5F15';
      itemsHtml+='<div class="item-multi">';
      itemsHtml+='<input type="number" class="multi-input" value="'+qty+'" min="0" max="24" step="0.5" onclick="event.stopPropagation()" onchange="setQty(\''+it.id+'\',this.value)">';
      itemsHtml+='<span class="multi-label">'+it.multi.unit+'</span>';
      itemsHtml+='<span class="multi-total" style="color:'+totC+';background:'+totB+'">= '+(tot>0?'+':'')+tot+'%</span>';
      itemsHtml+='</div>';
    }
    itemsHtml+='</div>';
  });
  return '<div class="section-card"><div class="section-header"><span class="section-icon">'+cat.icon+'</span><span class="section-name" style="color:'+cat.color+'">'+cat.cat+'</span>'+totalHtml+'</div><div class="items">'+itemsHtml+'</div></div>';
}

function toggle(id){
  if(checked[id]){delete checked[id];delete quantities[id]}
  else{checked[id]=true;const it=getItem(id);if(it&&it.multi)quantities[id]=it.multi.def}
  document.getElementById('results').style.display='none';
  document.getElementById('saveMsg').style.display='none';
  renderSections();
}

function setQty(id,val){
  val=Math.max(0,parseFloat(val)||0);
  quantities[id]=val;
  document.getElementById('results').style.display='none';
  renderSections();
}

// =================== CALCULATE ===================
function getColor(v){if(v>=80)return'#2D936C';if(v>=60)return'#81B29A';if(v>=40)return'#F2CC8F';if(v>=20)return'#E07A5F';return'#C1292E'}
function getLabel(v){if(v>=80)return'Excellent , journée optimale';if(v>=60)return'Bon , quelques précautions';if(v>=40)return'Attention , protéger l\'énergie';if(v>=20)return'Alerte , essentiels uniquement';return'Critique , repos prioritaire'}

function calculate(){
  let totalDrains=0;let totalRecharges=0;
  drains.forEach(c=>c.items.forEach(it=>{totalDrains+=getItemTotal(it)}));
  recharges.forEach(c=>c.items.forEach(it=>{totalRecharges+=getItemTotal(it)}));
  const gauge=Math.max(0,Math.min(100,startGauge+totalDrains+totalRecharges));
  currentGauge=gauge;
  const color=getColor(gauge);
  document.getElementById('gaugeValue').textContent=gauge+'%';
  document.getElementById('gaugeValue').style.color=color;
  document.getElementById('gaugeFill').style.width=gauge+'%';
  document.getElementById('gaugeFill').style.background='linear-gradient(90deg,'+color+'CC,'+color+')';
  const lbl=document.getElementById('gaugeLabel');
  lbl.textContent=getLabel(gauge);lbl.style.color=color;lbl.style.background=color+'12';
  const sd=document.getElementById('summaryRows');sd.innerHTML='';
  sd.innerHTML+='<div class="detail-row"><span style="color:#555">⚡ Jauge de départ</span><span style="font-weight:600;color:#4A6FA5">'+startGauge+'%</span></div>';
  sd.innerHTML+='<div class="detail-row"><span style="color:#555">📉 Total drains</span><span style="font-weight:600;color:#E07A5F">'+totalDrains+'%</span></div>';
  sd.innerHTML+='<div class="detail-row"><span style="color:#555">📈 Total recharges</span><span style="font-weight:600;color:#2D936C">'+(totalRecharges>0?'+':'')+totalRecharges+'%</span></div>';
  sd.innerHTML+='<div class="detail-row" style="border-top:2px solid #eee;padding-top:8px;margin-top:4px"><span style="color:#1a1a2e;font-weight:600">Jauge finale</span><span style="font-weight:700;color:'+color+'">'+gauge+'%</span></div>';
  const recs=[];
  if(gauge<60){recs.push('Protège ta soirée : lecture + cohérence cardiaque');recs.push('Pas de sortie sociale')}
  if(gauge<40){recs.push('Réduis la journée de travail si possible');recs.push('Sport léger uniquement');recs.push('Coucher avancé de 30-60 min')}
  if(gauge<20){recs.push('Mode survie : sommeil et alimentation uniquement');recs.push('Annule tout engagement social')}
  if(startGauge<75)recs.push('Jauge de départ basse : sieste de 20 min si possible');
  if(checked.d30)recs.push('Exposition au bruit : écouteurs anti-bruit');
  const rb=document.getElementById('recsBlock');const om=document.getElementById('optMsg');
  if(gauge>=80){rb.style.display='none';om.style.display='block';om.style.color='#2D936C';om.textContent='Journée optimale , tous les piliers accessibles.'}
  else{rb.style.display='block';om.style.display='none';const rl=document.getElementById('recsList');rl.innerHTML='';recs.forEach(r=>{rl.innerHTML+='<div class="rec-item"><span class="rec-arrow" style="color:'+color+'">→</span><span>'+r+'</span></div>'})}
  const data=getData();const sb=document.getElementById('saveBtn');
  sb.textContent=data[todayStr()]?'💾 Mettre à jour ('+todayStr()+')':'💾 Sauvegarder ('+todayStr()+')';
  sb.disabled=false;document.getElementById('saveMsg').style.display='none';
  const res=document.getElementById('results');res.style.display='block';res.style.boxShadow='0 4px 24px '+color+'30';res.style.border='2px solid '+color+'40';
  res.scrollIntoView({behavior:'smooth'});
}

function saveEntry(){
  if(currentGauge===null)return;
  const data=getData();
  data[todayStr()]={gauge:currentGauge,start:startGauge};
  setData(data);
  document.getElementById('saveMsg').style.display='block';
  document.getElementById('saveBtn').textContent='✓ Sauvegardé !';
  document.getElementById('saveBtn').disabled=true;
}

function resetAll(){
  checked={};quantities={};startGauge=100;currentGauge=null;
  document.getElementById('startSlider').value=100;document.getElementById('startInput').value=100;
  document.getElementById('results').style.display='none';document.getElementById('saveMsg').style.display='none';
  renderSections();
}

// =================== DATA TAB ===================
function setFilter(f){
  currentFilter=f;navOffset=0;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.filter-btn').forEach(b=>{if((f==='week'&&b.textContent.includes('Semaine'))||(f==='month'&&b.textContent.includes('Mois'))||(f==='year'&&b.textContent.includes('Année')))b.classList.add('active')});
  renderData();
}
function nav(dir){navOffset+=dir;renderData()}

function getRange(){
  const now=new Date();let start,end,label;
  if(currentFilter==='week'){
    const d=new Date(now);d.setDate(d.getDate()+navOffset*7);
    const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);
    start=new Date(d);start.setDate(diff);start.setHours(0,0,0,0);
    end=new Date(start);end.setDate(start.getDate()+6);
    label='Semaine du '+start.getDate()+'/'+(start.getMonth()+1)+' au '+end.getDate()+'/'+(end.getMonth()+1)+'/'+end.getFullYear();
  }else if(currentFilter==='month'){
    const d=new Date(now.getFullYear(),now.getMonth()+navOffset,1);
    start=new Date(d.getFullYear(),d.getMonth(),1);end=new Date(d.getFullYear(),d.getMonth()+1,0);
    const mo=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    label=mo[d.getMonth()]+' '+d.getFullYear();
  }else{const y=now.getFullYear()+navOffset;start=new Date(y,0,1);end=new Date(y,11,31);label='Année '+y}
  return{start,end,label};
}

function datesInRange(s,e){const arr=[];const d=new Date(s);while(d<=e){arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()+1)}return arr}

function renderData(){
  const data=getData();const{start,end,label}=getRange();
  document.getElementById('navLabel').textContent=label;
  const dates=datesInRange(start,end);const values=dates.map(d=>data[d]?data[d].gauge:null);
  const filled=values.filter(v=>v!==null);
  const sr=document.getElementById('statsRow');
  if(filled.length>0){
    const avg=Math.round(filled.reduce((a,b)=>a+b,0)/filled.length);
    sr.innerHTML='<div class="stat-card"><div class="stat-value" style="color:'+getColor(avg)+'">'+avg+'%</div><div class="stat-label">Moyenne</div></div>'
      +'<div class="stat-card"><div class="stat-value" style="color:'+getColor(Math.min(...filled))+'">'+Math.min(...filled)+'%</div><div class="stat-label">Min</div></div>'
      +'<div class="stat-card"><div class="stat-value" style="color:'+getColor(Math.max(...filled))+'">'+Math.max(...filled)+'%</div><div class="stat-label">Max</div></div>'
      +'<div class="stat-card"><div class="stat-value" style="color:#1a1a2e">'+filled.length+'/'+dates.length+'</div><div class="stat-label">Remplis</div></div>';
  }else{sr.innerHTML=''}
  const cl=dates.map(d=>{
    if(currentFilter==='year'){const dt=new Date(d+'T12:00:00');return dt.getDate()===1?['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][dt.getMonth()]:''}
    return shortD(d);
  });
  if(chartInst)chartInst.destroy();
  const ctx=document.getElementById('chart').getContext('2d');
  chartInst=new Chart(ctx,{type:'line',data:{labels:cl,datasets:[{label:'Énergie %',data:values,borderColor:'#4A6FA5',backgroundColor:'#4A6FA520',borderWidth:2.5,pointBackgroundColor:values.map(v=>v!==null?getColor(v):'transparent'),pointBorderColor:values.map(v=>v!==null?getColor(v):'transparent'),pointRadius:currentFilter==='year'?2:5,pointHoverRadius:7,fill:true,tension:.3,spanGaps:false}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%',stepSize:20},grid:{color:'#f0f2f5'}},x:{grid:{display:false},ticks:{maxRotation:45,font:{size:11}}}}}});
  const tb=document.getElementById('histBody');tb.innerHTML='';
  if(filled.length===0){tb.innerHTML='<tr><td colspan="3" class="no-data">Aucune donnée</td></tr>';return}
  [...dates].reverse().forEach(d=>{
    const e=data[d];const tr=document.createElement('tr');
    if(e){const c=getColor(e.gauge);tr.innerHTML='<td>'+fmtDate(d)+'</td><td><span class="pct-badge" style="background:'+c+'18;color:'+c+'">'+e.gauge+'%</span></td><td><button class="del-btn" onclick="delEntry(\''+d+'\')" title="Supprimer">🗑</button></td>'}
    else{tr.innerHTML='<td style="color:#ccc">'+fmtDate(d)+'</td><td style="color:#ddd;text-align:center">-</td><td></td>'}
    tb.appendChild(tr);
  });
}

function delEntry(d){if(!confirm('Supprimer le '+fmtDate(d)+' ?'))return;const data=getData();delete data[d];setData(data);renderData()}

// =================== INIT ===================
renderSections();
</script>
</body>
</html>
